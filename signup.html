<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2D5016" />
  <title>Kakeibo — Create Account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="log.css" />
</head>
<body class="auth-body">

  <!-- Alert Modal -->
  <div id="alertModal" class="alert-modal-overlay">
    <div class="alert-modal-card">
      <div id="alertModalText" class="alert-modal-text"></div>
      <button class="alert-modal-btn" onclick="closeAlert()">OK</button>
    </div>
  </div>

  <div class="auth-card">

    <!-- Header -->
    <div class="auth-header">
      <span class="auth-brand">Kakeibo</span>
      <span class="auth-tagline">The 100-year-old art of mindful budgeting.</span>
    </div>

    <!-- Body -->
    <div class="auth-body-inner">
      <h1 class="auth-title">Begin your journey</h1>
      <p class="auth-subtitle">Create an account to start tracking with intention.</p>

      <form id="signup-form" class="auth-form">
        <div class="form-group">
          <label for="fullName">Full Name</label>
          <input
            class="auth-input"
            type="text"
            id="fullName"
            placeholder="Your name"
            required
            autocomplete="name"
          />
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input
            class="auth-input"
            type="email"
            id="email"
            placeholder="you@example.com"
            required
            autocomplete="email"
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            class="auth-input"
            type="password"
            id="password"
            placeholder="Create a strong password"
            required
            autocomplete="new-password"
          />
        </div>

        <button type="submit" class="btn-auth">Create Account</button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="signin.html">Sign in</a>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
  <script>
    const saved = localStorage.getItem('kakeibo-theme') || 'light';
    document.documentElement.setAttribute('data-theme', saved);
  </script>
</body>
</html>
